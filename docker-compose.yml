services:
  postgres:
    image: postgres:16-alpine
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: typeorm-db-dev

    ports:
      - 5432:5432

    volumes:
      - typeorm_db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  typeorm_db_data:
